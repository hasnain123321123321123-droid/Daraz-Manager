<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f85606"><meta name="description" content="E Traders Daraz Business Manager">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
<title>E Traders — Daraz Manager</title>
<style>
:root{--orange:#f85606;--orange2:#ff7a32;--ink:#202124;--muted:#73777f;--bg:#f5f6f8;--card:#fff;--line:#eceef1;--green:#16834a;--red:#d64545;--shadow:0 8px 28px rgba(31,35,41,.06);--r:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}
.app{max-width:1180px;margin:auto;min-height:100vh;padding-bottom:88px}.top{background:linear-gradient(120deg,#f85606,#ff813d);color:#fff;padding:22px 20px 26px;border-radius:0 0 26px 26px;box-shadow:0 8px 22px #f8560626}.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:850;font-size:20px;letter-spacing:-.5px}.sub{font-size:12px;opacity:.88;margin-top:3px}.top-actions{display:flex;gap:8px}.top .ghost{border:1px solid #ffffff70;background:#ffffff20;color:white;padding:9px 12px;border-radius:12px;font-weight:650}
main{padding:18px 16px 24px}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:3px 0 16px}.pagehead h1{font-size:23px;margin:0;letter-spacing:-.6px}.muted{color:var(--muted)}.small{font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat,.panel,.formcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.stat{padding:16px;min-height:112px}.stat .label{font-size:12px;color:var(--muted);font-weight:650}.stat .value{font-size:25px;font-weight:850;letter-spacing:-.8px;margin-top:10px}.stat .hint{font-size:11px;color:var(--muted);margin-top:2px}.orange{color:var(--orange)}.green{color:var(--green)}.red{color:var(--red)}
.two{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-top:14px}.panel{padding:17px}.panel h3{font-size:15px;margin:0 0 14px}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.quick button{border:1px solid #ffe0d1;background:#fff8f4;color:#c84400;padding:14px;border-radius:14px;text-align:left;font-weight:750}.quick span{display:block;font-size:11px;color:#9c6a51;font-weight:500;margin-top:3px}
.btn{border:0;background:var(--orange);color:white;padding:11px 16px;border-radius:13px;font-weight:750;box-shadow:0 5px 12px #f8560626}.btn.secondary{background:#fff1e9;color:#c84400;box-shadow:none;border:1px solid #ffdfcf}.btn.ghost{background:#f3f4f6;color:#30343a;box-shadow:none}.btn.danger{background:#fff0f0;color:#b42323;box-shadow:none}.btn.sm{padding:8px 11px;font-size:12px;border-radius:10px}.btn:active{transform:translateY(1px)}
.nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20;padding:8px 7px max(8px,env(safe-area-inset-bottom))}.navinner{width:min(100%,760px);display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.nav button{border:0;background:transparent;color:#777d86;border-radius:13px;padding:7px 2px;font-size:10px;font-weight:700}.nav button b{display:block;font-size:19px;line-height:22px;margin-bottom:3px}.nav button.active{background:#fff0e8;color:var(--orange)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar input{flex:1;min-width:150px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font-size:12px;color:#60656e;font-weight:700}.field input,.field select,.toolbar input,.toolbar select{width:100%;border:1px solid #e2e5e9;background:#fff;border-radius:12px;padding:11px 12px;outline:none;color:var(--ink)}input:focus,select:focus{border-color:#ff9b69;box-shadow:0 0 0 3px #f8560618}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 12px}.span2{grid-column:span 2}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:720px;background:#fff}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap}th{background:#fafafa;color:#747983;font-size:11px;text-transform:uppercase;letter-spacing:.35px}tr:last-child td{border-bottom:0}.status{display:inline-block;border-radius:99px;padding:5px 9px;font-size:10px;font-weight:800;background:#f1f3f5;color:#565c65}.s-delivered{background:#e8f7ee;color:#137843}.s-shipped,.s-to-ship{background:#fff2df;color:#a65b00}.s-return,.s-failed-delivery{background:#fff0f0;color:#b42323}.actions{display:flex;gap:6px}.empty{text-align:center;padding:28px 12px;color:var(--muted)}.empty b{display:block;color:#343840;margin-bottom:4px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.supplier{border:1px solid var(--line);border-radius:15px;padding:14px;background:#fff}.supplier h4{margin:0 0 9px;font-size:14px}.supplier .money{font-size:20px;font-weight:850}.supplier .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:8px}.supplier .actions{margin-top:12px}
.modalback{position:fixed;inset:0;background:#16191f70;z-index:40;display:none;align-items:flex-end;justify-content:center;padding:12px}.modalback.show{display:flex}.modal{width:min(100%,560px);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:19px;box-shadow:0 20px 70px #0003}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modalhead h2{margin:0;font-size:19px}.close{border:0;background:#f1f2f4;border-radius:10px;width:34px;height:34px;font-size:20px}
.notice{padding:12px 14px;border-radius:13px;background:#fff7ed;border:1px solid #ffdfc9;color:#8c451c;font-size:12px;margin-bottom:13px}.footnote{font-size:11px;color:var(--muted);margin-top:12px}.hidden{display:none!important}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.top{padding-top:18px}.stat{min-height:100px}.stat .value{font-size:23px}}
@media(min-width:761px){.app{padding-bottom:30px}.nav{position:sticky;top:0;bottom:auto;border:0;background:transparent;padding:0 16px 12px}.navinner{background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:var(--shadow)}.nav button{font-size:12px}.nav button b{display:inline-block;margin:0 7px 0 0;font-size:15px}.modalback{align-items:center}}
</style></head>
<body><div class="app">
<header class="top"><div class="toprow"><div><div class="brand">E TRADERS <span style="font-size:11px;font-weight:600;opacity:.8">• DARAZ MANAGER</span></div><div class="sub">Your business, under control.</div></div><div class="top-actions"><button class="ghost" id="exportBtn">Backup</button><button class="ghost" id="settingsBtn">⚙</button></div></div></header>
<nav class="nav"><div class="navinner">
<button data-page="dashboard" class="active"><b>▦</b>Dashboard</button><button data-page="orders"><b>▤</b>Orders</button><button data-page="suppliers"><b>♙</b>Suppliers</button><button data-page="payments"><b>⇄</b>Payments</button><button data-page="settings"><b>⚙</b>Settings</button>
</div></nav><main id="main"></main></div>
<div class="modalback" id="modalBack"><div class="modal"><div class="modalhead"><h2 id="modalTitle">Add</h2><button class="close" id="closeModal">×</button></div><div id="modalBody"></div></div></div>
<input type="file" id="restoreFile" accept="application/json" class="hidden">
<script>
const KEY='etraders_daraz_manager_v1';
const DEFAULT_SUPPLIERS=['Bada','Ayub','Walayat','Umer','Irshad'];
const STATUSES=['To Ship','Shipped','Delivered','Failed Delivery','Return'];
let state={suppliers:DEFAULT_SUPPLIERS.map((name,i)=>({id:'s'+(i+1),name})),orders:[],payments:[]};
let page='dashboard',editing=null,searchTerm='',statusFilter='All';
const $=s=>document.querySelector(s);
const money=n=>'Rs. '+Number(n||0).toLocaleString('en-PK',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.orders)&&Array.isArray(x.suppliers)&&Array.isArray(x.payments))state=x;}catch(e){}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function supplierName(id){return state.suppliers.find(s=>s.id===id)?.name||'Archived supplier';}
function calc(o){const commission=Number(o.price||0)*.38;return {commission,profit:Number(o.price||0)-commission-Number(o.cost||0)}}
function supplierTotals(sid){const cost=state.orders.filter(o=>o.supplierId===sid).reduce((a,o)=>a+Number(o.cost||0),0);const paid=state.payments.filter(p=>p.supplierId===sid).reduce((a,p)=>a+Number(p.amount||0),0);return {cost,paid,remaining:cost-paid};}
function totals(){const delivered=state.orders.filter(o=>o.status==='Delivered');const shipping=state.orders.filter(o=>['To Ship','Shipped'].includes(o.status));const returns=state.orders.filter(o=>o.status==='Return');const all=state.suppliers.map(s=>supplierTotals(s.id));return {delivered:delivered.length,shipping:shipping.length,returns:returns.length,profit:delivered.reduce((a,o)=>a+calc(o).profit,0),owed:all.reduce((a,x)=>a+x.remaining,0),paid:all.reduce((a,x)=>a+x.paid,0),supplierCost:all.reduce((a,x)=>a+x.cost,0)}}
function nav(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));}
function setPage(p){page=p;searchTerm='';statusFilter='All';nav();render();}
function render(){nav();const m=$('#main');if(page==='dashboard')m.innerHTML=dashboard();if(page==='orders')m.innerHTML=ordersPage();if(page==='suppliers')m.innerHTML=suppliersPage();if(page==='payments')m.innerHTML=paymentsPage();if(page==='settings')m.innerHTML=settingsPage();bindPage();}
function dashboard(){const t=totals();const recent=[...state.orders].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,5);return `
<div class="pagehead"><div><h1>Dashboard</h1><div class="muted small">Business overview at a glance</div></div><button class="btn" data-action="add-order">＋ Add Order</button></div>
<div class="grid">
<div class="stat"><div class="label">DELIVERED ORDERS</div><div class="value">${t.delivered}</div><div class="hint">Successfully delivered</div></div>
<div class="stat"><div class="label">SHIPPING ORDERS</div><div class="value">${t.shipping}</div><div class="hint">To Ship + Shipped</div></div>
<div class="stat"><div class="label">RETURNS</div><div class="value">${t.returns}</div><div class="hint">Orders marked returned</div></div>
<div class="stat"><div class="label">SUPPLIER DUES</div><div class="value orange">${money(t.owed)}</div><div class="hint">Outstanding supplier credit</div></div>
<div class="stat"><div class="label">AMOUNT PAID</div><div class="value">${money(t.paid)}</div><div class="hint">All recorded payments</div></div>
<div class="stat"><div class="label">DELIVERED PROFIT</div><div class="value green">${money(t.profit)}</div><div class="hint">Delivered orders only</div></div>
</div>
<div class="two"><section class="panel"><h3>Quick actions</h3><div class="quick"><button data-action="add-order">＋ Add new order<span>Record a Daraz order</span></button><button data-action="add-payment">⇄ Record payment<span>Pay a supplier</span></button><button data-action="add-supplier">♙ Add supplier<span>Manage supplier list</span></button><button data-action="backup">↓ Export backup<span>Keep your data safe</span></button></div></section>
<section class="panel"><h3>Business summary</h3><div style="display:flex;justify-content:space-between;margin:10px 0"><span class="muted">Supplier purchases</span><b>${money(t.supplierCost)}</b></div><div style="display:flex;justify-content:space-between;margin:10px 0"><span class="muted">Total paid</span><b>${money(t.paid)}</b></div><div style="height:1px;background:var(--line);margin:12px 0"></div><div style="display:flex;justify-content:space-between"><b>Remaining credit</b><b class="orange">${money(t.owed)}</b></div><p class="footnote">Commission is fixed at 38% of Daraz listed price.</p></section></div>
<section class="panel" style="margin-top:14px"><h3>Recent orders</h3>${recent.length?`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Product</th><th>Supplier</th><th>Status</th><th>Profit</th></tr></thead><tbody>${recent.map(o=>`<tr><td>${esc(o.date)}</td><td>${esc(o.product)}</td><td>${esc(supplierName(o.supplierId))}</td><td>${statusBadge(o.status)}</td><td>${money(calc(o).profit)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><b>No orders yet</b>Your new business records will appear here.</div>'}</section>`}
function statusBadge(s){return `<span class="status s-${String(s).toLowerCase().replaceAll(' ','-')}">${esc(s)}</span>`}
function ordersPage(){let rows=[...state.orders].sort((a,b)=>(b.date||'').localeCompare(a.date||''));if(searchTerm)rows=rows.filter(o=>(o.product+' '+o.orderId+' '+supplierName(o.supplierId)).toLowerCase().includes(searchTerm.toLowerCase()));if(statusFilter!=='All')rows=rows.filter(o=>o.status===statusFilter);return `<div class="pagehead"><div><h1>Orders</h1><div class="muted small">${state.orders.length} total records</div></div><button class="btn" data-action="add-order">＋ Add Order</button></div><div class="toolbar"><input id="orderSearch" placeholder="Search product, order ID, supplier…" value="${esc(searchTerm)}"><select id="statusFilter"><option>All</option>${STATUSES.map(s=>`<option ${statusFilter===s?'selected':''}>${s}</option>`).join('')}</select></div><section class="panel"><h3>Order register</h3>${rows.length?`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Order ID</th><th>Product</th><th>Supplier</th><th>Cost</th><th>Listed price</th><th>Commission 38%</th><th>Status</th><th>Profit</th><th>Actions</th></tr></thead><tbody>${rows.map(o=>{let c=calc(o);return `<tr><td>${esc(o.date)}</td><td>${esc(o.orderId||'—')}</td><td>${esc(o.product)}</td><td>${esc(supplierName(o.supplierId))}</td><td>${money(o.cost)}</td><td>${money(o.price)}</td><td>${money(c.commission)}</td><td>${statusBadge(o.status)}</td><td class="${c.profit>=0?'green':'red'}">${money(c.profit)}</td><td><div class="actions"><button class="btn sm secondary" data-edit-order="${o.id}">Edit</button><button class="btn sm danger" data-delete-order="${o.id}">Delete</button></div></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty"><b>No matching orders</b>Add your first order to get started.</div>'}</section><p class="footnote">Profit is calculated for every order, but the dashboard includes Delivered orders only. Supplier costs count toward credit for all statuses.</p>`}
function suppliersPage(){return `<div class="pagehead"><div><h1>Suppliers</h1><div class="muted small">Manage supplier list and outstanding balances</div></div><button class="btn" data-action="add-supplier">＋ Add Supplier</button></div><div class="cards">${state.suppliers.map(s=>{let t=supplierTotals(s.id);return `<div class="supplier"><h4>${esc(s.name)}</h4><div class="muted small">Remaining credit</div><div class="money ${t.remaining>0?'orange':'green'}">${money(t.remaining)}</div><div class="meta"><span>Purchases: ${money(t.cost)}</span><span>Paid: ${money(t.paid)}</span></div><div class="actions"><button class="btn sm secondary" data-edit-supplier="${s.id}">Rename</button><button class="btn sm danger" data-delete-supplier="${s.id}">Remove</button></div></div>`}).join('')}</div>${!state.suppliers.length?'<div class="panel empty"><b>No suppliers added</b>Add a supplier to begin recording orders.</div>':''}<section class="panel" style="margin-top:14px"><h3>Supplier totals</h3><div class="tablewrap"><table><thead><tr><th>Supplier</th><th>Total purchases</th><th>Amount paid</th><th>Remaining credit</th></tr></thead><tbody>${state.suppliers.map(s=>{let t=supplierTotals(s.id);return `<tr><td>${esc(s.name)}</td><td>${money(t.cost)}</td><td>${money(t.paid)}</td><td class="orange">${money(t.remaining)}</td></tr>`}).join('')||'<tr><td colspan="4">No suppliers yet</td></tr>'}</tbody></table></div></section><p class="footnote">Removing a supplier archives its name in historical orders and payments; financial records are preserved.</p>`}
function paymentsPage(){let rows=[...state.payments].sort((a,b)=>(b.date||'').localeCompare(a.date||''));return `<div class="pagehead"><div><h1>Payments</h1><div class="muted small">${rows.length} payment records</div></div><button class="btn" data-action="add-payment">＋ Record Payment</button></div><section class="panel"><h3>Payment history</h3>${rows.length?`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Supplier</th><th>Payment amount</th><th>Actions</th></tr></thead><tbody>${rows.map(p=>`<tr><td>${esc(p.date)}</td><td>${esc(supplierName(p.supplierId))}</td><td class="green">${money(p.amount)}</td><td><div class="actions"><button class="btn sm secondary" data-edit-payment="${p.id}">Edit</button><button class="btn sm danger" data-delete-payment="${p.id}">Delete</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><b>No payments recorded</b>Record a supplier payment to maintain your credit history.</div>'}</section>`}
function settingsPage(){return `<div class="pagehead"><div><h1>Settings & Backup</h1><div class="muted small">Application preferences and data safety</div></div></div><section class="panel"><h3>Calculation settings</h3><div class="field"><label>Daraz commission & taxes</label><input value="38% (Fixed)" disabled></div><div class="field"><label>Currency</label><input value="Pakistani Rupee (PKR)" disabled></div><p class="footnote">Commission is fixed at 38% and cannot be changed in this version.</p></section><section class="panel" style="margin-top:14px"><h3>Backup & restore</h3><div class="notice">Your records are saved in this browser on this device. Export backups regularly, especially before clearing browser data or changing phones.</div><div class="toolbar"><button class="btn" data-action="backup">↓ Download backup</button><button class="btn secondary" data-action="restore">↑ Restore backup</button></div><p class="footnote">Backup includes orders, supplier names and payment history.</p></section><section class="panel" style="margin-top:14px"><h3>Start fresh</h3><p class="muted small">Permanently clear all orders and payment records on this device. Your supplier list will return to the five default suppliers.</p><button class="btn danger" data-action="reset">Reset all app data</button></section><p class="footnote">E Traders Daraz Manager • Offline-capable browser app</p>`}
function openModal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modalBack').classList.add('show');}
function closeModal(){$('#modalBack').classList.remove('show');editing=null}
function supplierOptions(selected=''){return state.suppliers.map(s=>`<option value="${s.id}" ${s.id===selected?'selected':''}>${esc(s.name)}</option>`).join('')}
function orderForm(o={}){openModal(o.id?'Edit order':'Add new order',`<form id="orderForm"><div class="formgrid">
<div class="field"><label>Order date *</label><input name="date" type="date" required value="${esc(o.date||new Date().toISOString().slice(0,10))}"></div>
<div class="field"><label>Daraz Order ID</label><input name="orderId" value="${esc(o.orderId||'')}" placeholder="Optional"></div>
<div class="field span2"><label>Product name *</label><input name="product" required value="${esc(o.product||'')}" placeholder="e.g. Tecno Spark 50 Cover"></div>
<div class="field"><label>Supplier *</label><select name="supplierId" required>${supplierOptions(o.supplierId||'')} </select></div>
<div class="field"><label>Order status *</label><select name="status">${STATUSES.map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
<div class="field"><label>Supplier cost (Rs.) *</label><input name="cost" type="number" min="0" step=".01" required value="${esc(o.cost??'')}" placeholder="0"></div>
<div class="field"><label>Daraz listed price (Rs.) *</label><input name="price" type="number" min="0" step=".01" required value="${esc(o.price??'')}" placeholder="0"></div>
</div><div class="notice">Commission (38%) and profit are calculated automatically. Current commission: <b id="liveCommission">${money(Number(o.price||0)*.38)}</b></div><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn ghost" id="cancelModal">Cancel</button><button class="btn" type="submit">Save order</button></div></form>`);
const f=$('#orderForm');f.price.addEventListener('input',()=>$('#liveCommission').textContent=money(Number(f.price.value||0)*.38));f.addEventListener('submit',e=>{e.preventDefault();let d=new FormData(f);let data={id:o.id||uid(),date:d.get('date'),orderId:d.get('orderId').trim(),product:d.get('product').trim(),supplierId:d.get('supplierId'),status:d.get('status'),cost:Number(d.get('cost')),price:Number(d.get('price'))};if(!data.supplierId){alert('Please add a supplier first.');return}let i=state.orders.findIndex(x=>x.id===data.id);if(i>=0)state.orders[i]=data;else state.orders.push(data);save();closeModal();render();});$('#cancelModal').onclick=closeModal;}
function supplierForm(s){openModal(s?'Rename supplier':'Add supplier',`<form id="supplierForm"><div class="field"><label>Supplier name *</label><input name="name" required maxlength="50" value="${esc(s?.name||'')}" placeholder="Enter supplier name"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn ghost" id="cancelModal">Cancel</button><button class="btn">Save supplier</button></div></form>`);$('#supplierForm').addEventListener('submit',e=>{e.preventDefault();let name=new FormData(e.target).get('name').trim();if(state.suppliers.some(x=>x.name.toLowerCase()===name.toLowerCase()&&x.id!==s?.id)){alert('A supplier with this name already exists.');return}if(s)s.name=name;else state.suppliers.push({id:uid(),name});save();closeModal();render()});$('#cancelModal').onclick=closeModal;}
function paymentForm(p={}){openModal(p.id?'Edit payment':'Record supplier payment',`<form id="paymentForm"><div class="field"><label>Payment date *</label><input name="date" type="date" required value="${esc(p.date||new Date().toISOString().slice(0,10))}"></div><div class="field"><label>Supplier *</label><select name="supplierId" required>${supplierOptions(p.supplierId||'')}</select></div><div class="field"><label>Payment amount (Rs.) *</label><input name="amount" type="number" min=".01" step=".01" required value="${esc(p.amount??'')}" placeholder="0"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn ghost" id="cancelModal">Cancel</button><button class="btn">Save payment</button></div></form>`);$('#paymentForm').addEventListener('submit',e=>{e.preventDefault();let d=new FormData(e.target),data={id:p.id||uid(),date:d.get('date'),supplierId:d.get('supplierId'),amount:Number(d.get('amount'))};let i=state.payments.findIndex(x=>x.id===data.id);if(i>=0)state.payments[i]=data;else state.payments.push(data);save();closeModal();render()});$('#cancelModal').onclick=closeModal;}
function backup(){let blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString(),app:'E Traders Daraz Manager'},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='e-traders-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);}
function restore(){ $('#restoreFile').click();}
function bindPage(){document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action)));document.querySelectorAll('[data-edit-order]').forEach(b=>b.onclick=()=>orderForm(state.orders.find(x=>x.id===b.dataset.editOrder)));document.querySelectorAll('[data-delete-order]').forEach(b=>b.onclick=()=>{if(confirm('Delete this order? Supplier credit will be recalculated.')){state.orders=state.orders.filter(x=>x.id!==b.dataset.deleteOrder);save();render()}});document.querySelectorAll('[data-edit-supplier]').forEach(b=>b.onclick=()=>supplierForm(state.suppliers.find(x=>x.id===b.dataset.editSupplier)));document.querySelectorAll('[data-delete-supplier]').forEach(b=>b.onclick=()=>{let id=b.dataset.deleteSupplier;if(confirm('Remove this supplier from the active list? Existing order and payment history will be preserved as archived records.')){state.suppliers=state.suppliers.filter(x=>x.id!==id);save();render()}});document.querySelectorAll('[data-edit-payment]').forEach(b=>b.onclick=()=>paymentForm(state.payments.find(x=>x.id===b.dataset.editPayment)));document.querySelectorAll('[data-delete-payment]').forEach(b=>b.onclick=()=>{if(confirm('Delete this payment record? Supplier balance will be recalculated.')){state.payments=state.payments.filter(x=>x.id!==b.dataset.deletePayment);save();render()}});let s=$('#orderSearch');if(s)s.oninput=()=>{searchTerm=s.value;let pos=s.selectionStart;render();let el=$('#orderSearch');el.focus();el.setSelectionRange(pos,pos)};let f=$('#statusFilter');if(f)f.onchange=()=>{statusFilter=f.value;render()};}
function action(a){if(a==='add-order'){if(!state.suppliers.length){alert('Add a supplier before creating an order.');setPage('suppliers');return}orderForm()}if(a==='add-payment'){if(!state.suppliers.length){alert('Add a supplier before recording a payment.');setPage('suppliers');return}paymentForm()}if(a==='add-supplier')supplierForm();if(a==='backup')backup();if(a==='restore')restore();if(a==='reset'&&confirm('This will permanently clear all orders, payments and custom supplier names on this device. Continue?')){state={suppliers:DEFAULT_SUPPLIERS.map((name,i)=>({id:'s'+(i+1),name})),orders:[],payments:[]};save();render();}}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));$('#closeModal').onclick=closeModal;$('#modalBack').addEventListener('click',e=>{if(e.target===$('#modalBack'))closeModal()});$('#settingsBtn').onclick=()=>setPage('settings');$('#exportBtn').onclick=backup;$('#restoreFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let x=JSON.parse(await file.text());if(!Array.isArray(x.orders)||!Array.isArray(x.suppliers)||!Array.isArray(x.payments))throw Error('Invalid backup');if(confirm('Restore this backup? Current app data will be replaced.')){state={orders:x.orders,suppliers:x.suppliers,payments:x.payments};save();render();alert('Backup restored successfully.')}}catch(err){alert('Could not restore: invalid backup file.')}e.target.value=''};
load();render();
if('serviceWorker'in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
